[project]
name = "leantoken"
version = "0.1.0"
description = "Coding agent that completes dev tasks on the fewest tokens"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "textual>=0.80"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
leantoken = "leantoken.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["leantoken"]
