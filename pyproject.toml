[project]
name = "slendertoken"
version = "0.1.0"
description = "Coding agent that completes dev tasks on the fewest tokens"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "textual>=0.80", "textual-image>=0.8", "resvg-py>=0.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6"]

[project.scripts]
slendertoken = "slendertoken.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["slendertoken"]
