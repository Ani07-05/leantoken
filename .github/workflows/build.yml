name: build

# Cross-compiles single static binaries. Every run uploads them as workflow artifacts;
# pushing a v* tag also attaches them, with checksums, to a GitHub release (what install.sh downloads).
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          set -e
          version="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            bin=slendertoken; [ "$os" = windows ] && bin=slendertoken.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$version" -o "dist/$bin" ./cmd/slendertoken
            if [ "$os" = windows ]; then
              (cd dist && zip -q "slendertoken_${os}_${arch}.zip" "$bin")
            else
              tar -czf "dist/slendertoken_${os}_${arch}.tar.gz" -C dist "$bin"
            fi
            rm "dist/$bin"
          done
          (cd dist && sha256sum * > checksums.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: slendertoken
          path: dist/*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
